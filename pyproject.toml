[project]
name = "soc-testbed"
version = "0.1.0"
description = "Semantic Operation Continuity research testbed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pyshacl>=0.30,<1",
    "pyyaml>=6,<7",
    "rdflib>=7,<8",
]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
    "types-pyyaml",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["soc", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket"
filterwarnings = [
    "ignore:ConjunctiveGraph is deprecated, use Dataset instead:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
include = ["soc/ledger/*", "soc/episode.py", "soc/tasks/*", "eval/episode.py"]

[tool.importlinter]
root_packages = ["soc", "eval", "analysis"]

[[tool.importlinter.contracts]]
name = "Runtime cannot import evaluation or analysis"
type = "forbidden"
source_modules = ["soc"]
forbidden_modules = ["eval", "analysis"]
