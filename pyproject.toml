[project]
name = "soc-testbed"
version = "0.1.0"
description = "Semantic Operation Continuity research testbed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pyshacl>=0.30,<1",
    "pyyaml>=6,<7",
    "rdflib>=7,<8",
]

[project.optional-dependencies]
cooperation = ["tokenizers>=0.23,<1"]
embeddings = [
    "huggingface-hub>=2.4,<3",
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
    "types-pyyaml",
    "tokenizers>=0.23,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["soc", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -m 'not nightly'"
markers = ["nightly: optional integration checks requiring provisioned external assets"]
filterwarnings = [
    "ignore:ConjunctiveGraph is deprecated, use Dataset instead:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
include = ["soc/cooperation/*", "soc/ledger/*", "soc/episode.py", "soc/tasks/*", "soc/providers/*", "soc/enforce/*", "soc/baseline/*", "eval/episode.py", "eval/continuity.py", "analysis/timeline.py", "analysis/unknowns.py"]

[tool.importlinter]
root_packages = ["soc", "eval", "analysis"]

[[tool.importlinter.contracts]]
name = "Runtime cannot import evaluation or analysis"
type = "forbidden"
source_modules = ["soc"]
forbidden_modules = ["eval", "analysis"]
